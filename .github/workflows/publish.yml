name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@senscience'

      - name: Install
        run: npm ci

      - name: Build
        run: npx turbo run build --filter @senscience/curvenote-editor

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: packages/editor

      # The tag drives the release; a mismatch means the tag was cut from the
      # wrong commit, which is not something to discover after publishing.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/editor/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package version $PKG"
            exit 1
          fi
        if: github.ref_type == 'tag'

      - name: Publish
        run: npm publish --workspace @senscience/curvenote-editor --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
